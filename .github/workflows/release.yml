name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release-Metadaten validieren
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Annotierten Release-Tag explizit abrufen
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Tag, Version, main und Release Notes prüfen
        run: >-
          python -m scripts.release_check
          --tag "${GITHUB_REF_NAME}"
          --main-ref origin/main

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Paket installieren
        run: python -m pip install -e .

      - name: Tests ausführen
        run: python -m unittest discover -s tests

  build:
    name: Wheel und sdist einmalig bauen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build-Werkzeuge installieren
        run: python -m pip install -e ".[dev]"

      - name: Artefakte bauen
        run: python -m build --outdir dist

      - name: Build-Artefakte weitergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: euer-dist
          path: dist/
          if-no-files-found: error

  verify-artifacts:
    name: Build-Artefakte prüfen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build-Artefakte laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: euer-dist
          path: dist/

      - name: Prüfwerkzeuge installieren
        run: python -m pip install -e ".[dev]"

      - name: Metadaten und Installations-Smoke-Tests ausführen
        run: python -m scripts.verify_artifacts dist

  github-draft:
    name: GitHub-Release-Draft anlegen
    needs: verify-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Annotierten Release-Tag explizit abrufen
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build-Artefakte laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: euer-dist
          path: dist/

      - name: Release Notes extrahieren
        run: >-
          python -m scripts.release_check
          --tag "${GITHUB_REF_NAME}"
          --main-ref origin/main
          --notes-output release-notes.md

      - name: Draft idempotent anlegen oder vervollständigen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "Das Release $RELEASE_TAG ist bereits veröffentlicht und unveränderlich." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "euer ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "euer ${RELEASE_TAG#v}" \
              --notes-file release-notes.md \
              dist/*
          fi

  publish-pypi:
    name: PyPI veröffentlichen
    needs: github-draft
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/euer
    permissions:
      id-token: write
    steps:
      - name: Build-Artefakte laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: euer-dist
          path: dist/

      - name: PyPI veröffentlichen
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true

  publish-github:
    name: GitHub-Release veröffentlichen
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Draft als immutable Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false
