name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Paket installieren
        run: python -m pip install -e .

      - name: Tests ausführen
        run: python -m unittest discover -s tests

  quality:
    name: Qualität und Paket-Build
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Entwicklungswerkzeuge installieren
        run: python -m pip install -e ".[dev]"

      - name: Ruff ausführen
        run: |
          ruff check .
          ruff format --check .

      - name: Paket bauen
        run: python -m build

  xlsx:
    name: XLSX und Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: XLSX- und Entwicklungsabhängigkeiten installieren
        run: python -m pip install -e ".[dev,xlsx]"

      - name: Tests mit Coverage ausführen
        run: |
          coverage run -m unittest discover -s tests
          coverage combine
          coverage report
