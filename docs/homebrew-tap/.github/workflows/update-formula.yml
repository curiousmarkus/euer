name: Update Homebrew Formula

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: homebrew-formula-update
  cancel-in-progress: false

jobs:
  test:
    name: Formula prüfen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Repository auschecken
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .

      - name: PyPI-Daten und Ressourcen aktualisieren
        run: python3 scripts/update_formula.py Formula/euer.rb

      - name: Lokale Tap-Arbeitskopie für Homebrew registrieren
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          tap_path="$(brew --repository)/Library/Taps/$GITHUB_REPOSITORY_OWNER/homebrew-$tap_repository"
          mkdir -p "$tap_path"
          cp -R "$GITHUB_WORKSPACE/." "$tap_path/"
          brew trust --tap "$tap_name"

      - name: Formula-Stil und Audit prüfen
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          brew style Formula/euer.rb
          brew audit --tap="$tap_name" --formula

      - name: Formula installieren und testen
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          brew install --build-from-source "$tap_name/euer"
          brew test "$tap_name/euer"

  commit:
    name: Geprüfte Formula übernehmen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Repository auschecken
        run: >-
          git clone --depth 1
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          .

      - name: Formula erneut aktualisieren
        run: |
          python3 scripts/update_formula.py Formula/euer.rb

      - name: Lokale Tap-Arbeitskopie für Homebrew registrieren
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          tap_path="$(brew --repository)/Library/Taps/$GITHUB_REPOSITORY_OWNER/homebrew-$tap_repository"
          mkdir -p "$tap_path"
          cp -R "$GITHUB_WORKSPACE/." "$tap_path/"
          brew trust --tap "$tap_name"

      - name: Formula-Stil und Audit prüfen
        run: |
          tap_repository_full="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          tap_repository="$(printf '%s' "$tap_repository_full" | sed 's/^homebrew-//')"
          tap_name="$GITHUB_REPOSITORY_OWNER/$tap_repository"
          brew style Formula/euer.rb
          brew audit --tap="$tap_name" --formula

      - name: Änderung mit eigenem Repository-Token übernehmen
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/euer.rb; then
            echo "Keine neue PyPI-Version vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/euer.rb
          git commit -m "euer: update formula"
          git push
