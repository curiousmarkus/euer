[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euercli"
version = "0.7.0"
description = "EÜR (Einnahmenüberschussrechnung) CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GNU AGPLv3"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.0"]
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "ruff>=0.8",
]

[project.scripts]
euer = "euercli.cli:main"

[tool.setuptools]
packages = ["euercli", "euercli.commands", "euercli.services"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["euercli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
