[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euercli"
version = "0.7.0"
description = "EÜR (Einnahmenüberschussrechnung) CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Markus"},
]
keywords = ["buchhaltung", "euer", "finanzen", "freelancer", "sqlite"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.0"]
dev = [
    "build>=1.2",
    "coverage>=7.10",
    "ruff>=0.8",
]

[project.scripts]
euer = "euercli.cli:main"

[project.urls]
Issues = "https://github.com/curiousmarkus/euer/issues"
Repository = "https://github.com/curiousmarkus/euer"

[tool.setuptools]
packages = ["euercli", "euercli.commands", "euercli.services"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["euercli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
